# ASP.NET Core - Ubuntu (Alternative)
# Faster Linux-based pipeline for .NET 8.0
# Use this if you want faster build times

trigger:
- develop

pool:
  vmImage: 'ubuntu-latest'  # Ubuntu 22.04 - faster than Windows

variables:
  solution: '**/*.sln'
  buildConfiguration: 'Release'
  dotnetVersion: '8.x'

steps:
# Install .NET SDK
- task: UseDotNet@2
  displayName: 'Install .NET SDK 8.x'
  inputs:
    packageType: 'sdk'
    version: '$(dotnetVersion)'
    
# Restore NuGet packages
- task: DotNetCoreCLI@2
  displayName: 'Restore NuGet packages'
  inputs:
    command: 'restore'
    projects: '$(solution)'
    
# Build the solution
- task: DotNetCoreCLI@2
  displayName: 'Build solution'
  inputs:
    command: 'build'
    projects: '$(solution)'
    arguments: '--configuration $(buildConfiguration) --no-restore'
    
# Run tests
- task: DotNetCoreCLI@2
  displayName: 'Run unit tests'
  inputs:
    command: 'test'
    projects: '**/*Tests.csproj'
    arguments: '--configuration $(buildConfiguration) --no-build --collect:"XPlat Code Coverage"'
    publishTestResults: true
    
# Publish the web application
- task: DotNetCoreCLI@2
  displayName: 'Publish web application'
  inputs:
    command: 'publish'
    publishWebProjects: true
    arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory) --no-build'
    zipAfterPublish: true
    modifyOutputPath: true
    
# Publish build artifacts
- task: PublishBuildArtifacts@1
  displayName: 'Publish artifacts'
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)'
    ArtifactName: 'dropcitybikemvc'
    publishLocation: 'Container'
