# ASP.NET Core
# Minimal pipeline using Microsoft-hosted agents
# Avoids deprecated Windows 2019 pool

trigger:
- develop

# Use Microsoft-hosted agent (not specific pool)
pool:
  name: Azure Pipelines
  vmImage: 'windows-latest'

variables:
  buildConfiguration: 'Release'

steps:
# Install .NET 8.0 SDK
- task: UseDotNet@2
  displayName: 'Use .NET 8.0'
  inputs:
    version: '8.0.x'
    
# Restore
- task: CmdLine@2
  displayName: 'Restore packages'
  inputs:
    script: 'dotnet restore'
    
# Build
- task: CmdLine@2
  displayName: 'Build'
  inputs:
    script: 'dotnet build --configuration $(buildConfiguration) --no-restore'
    
# Test
- task: CmdLine@2
  displayName: 'Test'
  inputs:
    script: 'dotnet test --configuration $(buildConfiguration) --no-build --logger trx'
  continueOnError: true
    
# Publish
- task: CmdLine@2
  displayName: 'Publish'
  inputs:
    script: 'dotnet publish MVCCitybike/MVCCitybike.csproj --configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/app --no-build'
    
# Zip
- task: ArchiveFiles@2
  displayName: 'Archive files'
  inputs:
    rootFolderOrFile: '$(Build.ArtifactStagingDirectory)/app'
    includeRootFolder: false
    archiveType: 'zip'
    archiveFile: '$(Build.ArtifactStagingDirectory)/app.zip'
    
# Upload
- task: PublishBuildArtifacts@1
  displayName: 'Publish artifact'
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)/app.zip'
    ArtifactName: 'drop'