# ASP.NET Core
# Build and test ASP.NET Core projects targeting .NET 8.0
# Simplified pipeline to avoid service connection issues

trigger:
- develop

pool:
  vmImage: 'windows-latest'  # Will use latest available Windows (currently 2022)

variables:
  buildConfiguration: 'Release'

steps:
# Install .NET 8.0 SDK
- task: UseDotNet@2
  displayName: 'Install .NET 8 SDK'
  inputs:
    version: '8.x'
    packageType: sdk
    
# Restore dependencies
- script: dotnet restore
  displayName: 'Restore NuGet packages'
    
# Build
- script: dotnet build --configuration $(buildConfiguration) --no-restore
  displayName: 'Build solution'
    
# Test
- script: dotnet test --configuration $(buildConfiguration) --no-build --logger trx --results-directory $(Build.ArtifactStagingDirectory)/TestResults
  displayName: 'Run tests'
  continueOnError: true
    
# Publish test results
- task: PublishTestResults@2
  displayName: 'Publish test results'
  inputs:
    testResultsFormat: 'VSTest'
    testResultsFiles: '$(Build.ArtifactStagingDirectory)/TestResults/*.trx'
    mergeTestResults: true
  condition: always()
    
# Publish application
- script: dotnet publish MVCCitybike/MVCCitybike.csproj --configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/publish --no-build
  displayName: 'Publish application'
    
# Create zip archive
- task: ArchiveFiles@2
  displayName: 'Create deployment package'
  inputs:
    rootFolderOrFile: '$(Build.ArtifactStagingDirectory)/publish'
    includeRootFolder: false
    archiveType: 'zip'
    archiveFile: '$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip'
    replaceExistingArchive: true
    
# Publish artifacts
- task: PublishBuildArtifacts@1
  displayName: 'Publish artifacts'
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip'
    ArtifactName: 'drop'
    publishLocation: 'Container'